function bindAdjustment(){const saveDraft=()=>{u.adjustments=[0,1,2,3].map(i=>$('adjust-'+i).value.trim()===''?NaN:Number($('adjust-'+i).value));u.adjustNote=$('adjustnote').value;};for(let i=0;i<4;i++)$('adjust-'+i).oninput=()=>saveDraft();$('adjustnote').oninput=()=>saveDraft();document.querySelectorAll('[data-adjust-player]').forEach(b=>b.onclick=()=>{saveDraft();const i=Number(b.dataset.adjustPlayer);u.adjustments[i]+=Number(b.dataset.adjustStep);$('adjust-'+i).value=String(u.adjustments[i]);});$('checktotals').onclick=()=>{const a=T.audit(state);warning=t(a.ok?'totalsCorrect':'totalsMismatch')+' · '+t('totalDifference')+' '+signed(a.difference);render();};$('applyadjust').onclick=()=>{saveDraft();if(act(()=>T.adjust(state,u.adjustments,u.adjustNote))){u.adjustments=[0,0,0,0];u.adjustNote='';render();}};const transferDraft=()=>{u.transferFrom=Number($('transferfrom').value);u.transferTo=Number($('transferto').value);u.transferAmount=$('transferamount').value.trim()===''?NaN:Number($('transferamount').value);};for(const id of ['transferfrom','transferto','transferamount'])$(id).onchange=transferDraft;$('applytransfer').onclick=()=>{transferDraft();const from=u.transferFrom,to=u.transferTo,n=u.transferAmount;if(![from,to].every(i=>Number.isInteger(i)&&i>=0&&i<4)||from===to||!Number.isSafeInteger(n)||n<=0||n>1000000){warning=t('invalidTransfer');render();return;}const delta=[0,0,0,0];delta[from]=-n;delta[to]=n;act(()=>T.adjust(state,delta,t('transferPoints')));};}

function receipt(record){const before=record.beforePoints||record.points.map((p,i)=>p-record.delta[i]);const rank=(points,i)=>{const sorted=points.map((p,j)=>({p,j})).sort((a,b)=>b.p-a.p||a.j-b.j);return record.rules?.tieSplit?sorted.findIndex(x=>x.p===points[i])+1:sorted.findIndex(x=>x.j===i)+1;};return '<section><h2>'+t('settlementChanges')+'</h2><div class="gap-scroll"><table><tr><th>'+t('player')+'</th><th>'+t('beforePoints')+'</th><th>'+t('points')+'</th><th>'+t('pointChange')+'</th><th>'+t('rankChange')+'</th></tr>'+record.points.map((p,i)=>{const a=record.beforeRanks?.[i]||rank(before,i),b=record.afterRanks?.[i]||rank(record.points,i);return '<tr><th>'+name(i)+'</th><td>'+before[i].toLocaleString(L.get())+'</td><td>'+p.toLocaleString(L.get())+'</td><td class="'+(record.delta[i]>0?'positive':record.delta[i]<0?'negative':'')+'">'+signed(record.delta[i])+'</td><td>'+a+' → '+b+(a===b?'':a>b?' (↑'+(a-b)+')':' (↓'+(b-a)+')')+'</td></tr>';}).join('')+'</table></div></section>';}
function finalReport(){const rows=state.finalSummary||T.summary(state),rules=state.finalRules||cfg;return '<section><h2>'+t('ended')+' · '+t('matchChanges')+'</h2><div class="gap-scroll"><table><tr>'+['player','rank','startPoints','points','pointChange','depositReceived','baseScore','rankBonus','finalScore','adjustedChange'].map(k=>'<th>'+t(k)+'</th>').join('')+'</tr>'+rows.map(x=>'<tr><th>'+name(x.player)+'</th><td>'+x.rank+'</td><td>'+(x.startPoints??state.initial/4).toLocaleString(L.get())+'</td><td>'+x.points.toLocaleString(L.get())+'</td><td>'+signed(x.rawChange??x.points-state.initial/4)+'</td><td>'+x.deposit.toLocaleString(L.get())+'</td><td>'+(x.baseScore??(x.points+x.deposit-rules.returnPoints)/1000).toFixed(3)+'</td><td>'+signed(x.bonus)+'</td><td><b>'+Number(x.score.toFixed(1)).toFixed(1)+'</b></td><td>'+signed(Math.round(x.score*1000*1000)/1000)+'</td></tr>').join('')+'</table></div><p class="hint">'+t('finalFormula')+'</p></section>';}
function inversePanel(s=state,prefix='',standalone=false){let body='';try{const answer=Comeback.solve(s,cfg,u.inversePlayer,u.inverseTarget,u.inverseTie);body=(answer.already?'<p class="hint">'+t('alreadyRank')+'</p>':'')+answer.scenarios.map(x=>{const normal=x.conditions.map(c=>'<li>'+c.han+' '+t('han')+' '+c.fu+' '+t('fu')+' → +'+c.received.toLocaleString(L.get())+'; '+t('rank')+' '+c.rank+'</li>').join('');const yak=x.yakuman?'<p>'+t('yakumanOption')+' '+x.yakuman.yakuman+' × ('+signed(x.yakuman.received)+')</p>':'';return '<article class="inverse-case"><h3>'+(x.tsumo?t('tsumo'):t('ron')+' · '+name(x.loser))+'</h3>'+(normal?'<ul>'+normal+'</ul>':'<p>'+t('noOrdinaryRoute')+'</p>')+yak+(!normal&&!yak?'<p>'+t('noRoute')+'</p>':'')+(x.repeat?'<p class="hint">'+t('dealerRepeatNote')+'</p>':'')+'</article>';}).join('');}catch(e){body='<p>'+L.error(e)+'</p>';}const html='<section id="inversePanel"><h2>'+(standalone?'':roundLabel()+' · ')+t('inverseTitle')+'</h2><div class="row"><label>'+t('player')+'<select id="inverseplayer">'+s.points.map((_,i)=>opt(i,name(i)+(i===s.dealer?' · '+t('dealer'):''),u.inversePlayer)).join('')+'</select></label><label>'+t('targetRank')+'<select id="inversetarget">'+[1,2,3].map(v=>opt(v,t('rank')+' '+v,u.inverseTarget)).join('')+'</select></label><label class="check"><input id="inversetie" type="checkbox" '+(u.inverseTie?'checked':'')+'>'+t('tieAllowed')+'</label></div><p class="hint">'+t('inverseNote')+'</p><div class="inverse-grid">'+body+'</div></section>';return prefix?html.replace(/id="([^"]+)"/g,(_,id)=>'id="'+prefix+id+'"'):html;}

$('undo').onclick=()=>act(()=>T.undo(state),false);$('newgame').onclick=()=>{if(confirm(t('resetConfirm'))){state=T.fresh();u.tenpai.fill(null);u.nagashi.fill(false);u.claims=[];u.payer=-1;warning='';persistGame();render();}};$('finish').onclick=()=>{if(confirm(t('finishConfirm')))act(()=>T.finish(state),false);};$('exportgame').onclick=()=>download('riichi-game.json',{...state,currentRules:cfg});
$('queue').onclick=()=>{try{if(u.method!=='ron')throw Error('queueHint');const r=responsibility(result());T.transfers(state,u.w,u.l,false,r);u.claims=u.claims.filter(c=>c.w!==u.w);u.claims.push({w:u.w,r});warning=t('added');render();}catch(e){warning=L.error(e);render();}};$('clearqueue').onclick=()=>{u.claims=[];render();};$('commitqueue').onclick=()=>act(()=>T.multiWin(state,u.claims,u.l));
}
function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function showRules(){const dialog=$('rulesdialog');dialog.innerHTML=`<div class="dialog-head"><h2>${t('rules')}</h2><button id="closerules">${t('close')}</button></div><label>${t('mode')}<select id="rulesmode">${opt('mleague',t('official'),mode)+opt('custom',t('custom'),mode)}</select></label><p class="hint">${t('ruleNote')}</p><h3>${t('preferences')}</h3><div class="row"><label>${t('defaultMode')}<select id="prefmode">${opt('numbers',t('numbers'),prefs.defaultMode)+opt('yaku',t('yaku'),prefs.defaultMode)+opt('points',t('directPoints'),prefs.defaultMode)}</select></label><label>${t('defaultHan')}<input id="prefhan" type="number" min="1" max="100" value="${prefs.han}"></label><label>${t('defaultFu')}<select id="preffu">${[20,25,30,40,50,60,70,80,90,100,110].map(v=>opt(v,v,prefs.fu)).join('')}</select></label><label>${t('defaultMethod')}<select id="prefmethod">${opt('ron',t('ron'),prefs.method)+opt('tsumo',t('tsumo'),prefs.method)}</select></label><label class="check"><input id="prefconfirm" type="checkbox" ${prefs.confirm?'checked':''}>${t('confirmSetting')}</label></div>${[...new Set(Rules.fields.map(f=>f[0]))].map(g=>`<details><summary>${esc(L.group(g))}</summary><div class="row">${Rules.fields.filter(f=>f[0]===g).map(f=>`<label>${esc(L.rule(f))}${f[3]==='bool'?`<input id="rule-${f[1]}" type="checkbox" ${cfg[f[1]]?'checked':''} ${mode==='mleague'?'disabled':''}>`:f[3]==='select'?`<select id="rule-${f[1]}" ${mode==='mleague'?'disabled':''}>${f[5].map(([v,n])=>opt(v,L.option(f[1],v,n),cfg[f[1]])).join('')}</select>`:`<input id="rule-${f[1]}" type="number" value="${cfg[f[1]]}" min="${f[5]}" max="${f[6]}" step="${f[7]}" ${mode==='mleague'?'disabled':''}>`}</label>`).join('')}</div></details>`).join('')}<p id="rulesmessage" class="hint">${t('unsaved')}</p><div class="toolbar"><button id="saverules" class="primary">${t('saveRules')}</button><button id="resetrules">${t('resetRules')}</button><button id="exportrules">${t('exportRules')}</button><button id="importrules">${t('importRules')}</button><input id="rulesfile" type="file" accept="application/json,.json" hidden></div>`;
if(!dialog.open)dialog.showModal();dialog.onclose=()=>{rulesOpen=false;if($('rulesdialog')===dialog)render();};$('closerules').onclick=()=>{rulesOpen=false;dialog.close();};$('rulesmode').onchange=e=>{mode=e.target.value;cfg={...(mode==='mleague'?Rules.mleague:custom)};T.configure(cfg);u.claims=[];u.payer=-1;persistRules();showRules();};
$('saverules').onclick=()=>{try{let nextCustom=custom,nextCfg=cfg;if(mode==='custom'){let v={};for(const f of Rules.fields){const e=$('rule-'+f[1]);v[f[1]]=f[3]==='bool'?e.checked:typeof f[4]==='number'?Number(e.value):e.value;}nextCustom=Rules.validate(v);nextCfg={...nextCustom};}const p={...prefs,defaultMode:$('prefmode').value,han:Number($('prefhan').value),fu:Number($('preffu').value),method:$('prefmethod').value,confirm:$('prefconfirm').checked};if(!Number.isInteger(p.han)||p.han<1||p.han>100)throw Error('invalidHanFu');if(p.defaultMode==='numbers')DirectRiichi.calculate({han:p.han,fu:p.fu,tsumo:p.method==='tsumo'});custom=nextCustom;cfg=nextCfg;prefs=p;T.configure(cfg);u.view=p.defaultMode;u.han=p.han;u.fu=p.fu;u.method=p.method;u.claims=[];u.payer=-1;persistRules();warning=t('savedRules');rulesOpen=false;render();}catch(e){$('rulesmessage').textContent=L.error(e);}};
$('resetrules').onclick=()=>{if(confirm(t('resetRules')+'?')){mode='custom';custom={...Rules.custom};cfg={...custom};T.configure(cfg);u.claims=[];u.payer=-1;persistRules();showRules();}};$('exportrules').onclick=()=>download('riichi-rules.json',{version:3,mode,custom,rules:cfg,prefs});$('importrules').onclick=()=>$('rulesfile').click();$('rulesfile').onchange=async()=>{try{const file=$('rulesfile').files[0];if(!file)return;if(file.size>100000)throw Error('invalid');const v=JSON.parse(await file.text());custom=Rules.validate(v.rules||v.custom||v);mode='custom';cfg={...custom};T.configure(cfg);u.claims=[];u.payer=-1;persistRules();showRules();}catch(e){$('rulesmessage').textContent=L.error(e);}};
}

function pointsInputs(){return '<p class="hint">'+t('pointsHint')+'</p><div class="row">'+(u.method==='ron'?'<label>'+t('ronBase')+'<input id="ronpoints" type="number" min="100" step="100" value="'+u.ronPoints+'"></label>':'<label>'+t(u.w===state.dealer?'eachBase':'childBase')+'<input id="childpoints" type="number" min="100" step="100" value="'+u.childPoints+'"></label>'+(u.w===state.dealer?'':'<label>'+t('dealerBase')+'<input id="dealerpoints" type="number" min="100" step="100" value="'+u.dealerPoints+'"></label>'))+'</div>';}
function showTool(){const d=$('tooldialog');d.innerHTML='<div class="dialog-head"><h2>'+t('standaloneInverse')+'</h2><button id="closetool">'+t('close')+'</button></div><p class="hint">'+t('toolHint')+'</p><button id="loadtool">'+t('loadTable')+'</button><div class="row">'+toolState.points.map((p,i)=>'<label>'+name(i)+'<input id="toolpoints'+i+'" type="number" step="100" value="'+p+'"></label>').join('')+'<label>'+t('dealer')+'<select id="tooldealer">'+toolState.points.map((_,i)=>opt(i,name(i),toolState.dealer)).join('')+'</select></label><label>'+t('honba')+'<input id="toolhonba" type="number" min="0" step="1" value="'+toolState.honba+'"></label><label>'+t('potSticks')+'<input id="toolpot" type="number" min="0" step="1" value="'+toolState.pot+'"></label></div><button id="runtool" class="primary">'+t('calculateTool')+'</button><p id="toolmessage" role="status"></p>'+inversePanel(toolState,'tool-',true);if(!d.open)d.showModal();d.onclose=()=>toolOpen=false;$('closetool').onclick=()=>{toolOpen=false;d.close();};$('loadtool').onclick=()=>{toolState=JSON.parse(JSON.stringify(state));toolState.blocked=[false,false,false,false];showTool();};
const update=()=>{const points=[0,1,2,3].map(i=>Number($('toolpoints'+i).value)),dealer=Number($('tooldealer').value),honba=Number($('toolhonba').value),pot=Number($('toolpot').value);if(points.some(p=>!Number.isSafeInteger(p)||Math.abs(p)>10000000)||!Number.isInteger(honba)||honba<0||honba>1000||!Number.isInteger(pot)||pot<0||pot>1000||![0,1,2,3].includes(dealer)){$('toolmessage').textContent=t('invalid');return false;}toolState={...toolState,points,dealer,honba,pot,initial:points.reduce((a,b)=>a+b,0)+pot*1000};return true;};$('runtool').onclick=()=>{if(update())showTool();};for(const [id,key,parse]of [['inverseplayer','inversePlayer',Number],['inversetarget','inverseTarget',Number],['inversetie','inverseTie',x=>x]])$('tool-'+id).onchange=e=>{if(update()){u[key]=id==='inversetie'?e.target.checked:parse(e.target.value);showTool();}};
}

function showHand(){const d=$('handdialog');if(!d.open)d.showModal();const f=$('handframe');if(window.RIICHI_HAND_DOCUMENT)f.srcdoc=window.RIICHI_HAND_DOCUMENT;else f.src='hand.html';f.onload=()=>f.contentWindow.postMessage({type:'riichi-context',context:context(),lang:L.get(),riichi:state.declared[u.w]?1:0},'*');}
window.addEventListener('message',event=>{const frame=$('handframe');if(!frame||event.source!==frame.contentWindow||!event.data||event.data.type!=='riichi-hand-settle')return;try{const o=event.data.options;if(!o||typeof o.hand!=='string')throw Error('invalid');if(!!o.riichi!==!!state.declared[u.w])throw Error('wrongRiichi');u.method=o.tsumo?'tsumo':'ron';const r=Riichi.calculate({...o,...context()});if(settle(r)){handOpen=false;render();}else frame.contentWindow.postMessage({type:'riichi-error',message:warning},'*');}catch(e){frame.contentWindow.postMessage({type:'riichi-error',message:L.error(e)},'*');}});
render();
})();
</script><script>(function(){
'use strict';
// Use Safari's visible viewport when the browser toolbar or keyboard changes height.
const root=document.documentElement,vv=window.visualViewport;let frame=0,locked=false,scrollY=0;
function viewport(){frame=0;const h=vv?vv.height:window.innerHeight,top=vv?vv.offsetTop:0;if(!h)return;root.style.setProperty('--visible-height',h+'px');root.style.setProperty('--visible-top',top+'px');root.dataset.keyboard=window.innerHeight-h>120?'open':'closed';}

window.addEventListener('resize',schedule,{passive:true});window.addEventListener('orientationchange',schedule,{passive:true});if(vv){vv.addEventListener('resize',schedule,{passive:true});vv.addEventListener('scroll',schedule,{passive:true});}viewport();
// Lock background scrolling while retaining the original scroll position on close.
function dialogs(){const open=!!document.querySelector('dialog[open]');if(open&&!locked){scrollY=window.scrollY;locked=true;document.body.style.position='fixed';document.body.style.top=-scrollY+'px';document.body.style.width='100%';}else if(!open&&locked){locked=false;document.body.style.position='';document.body.style.top='';document.body.style.width='';window.scrollTo(0,scrollY);}root.dataset.modal=open?'open':'closed';schedule();}

if(window.HTMLDialogElement&&!HTMLDialogElement.prototype.showModal){HTMLDialogElement.prototype.showModal=function(){this.setAttribute('open','');this.setAttribute('aria-modal','true');this.setAttribute('role','dialog');};HTMLDialogElement.prototype.close=function(){this.removeAttribute('open');this.dispatchEvent(new Event('close'));};}
document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>{schedule();if(e.target.isConnected&&e.target.closest('dialog'))e.target.scrollIntoView({block:'nearest',inline:'nearest'});},200);});
// Installation and offline assets are enabled only for a real web origin.
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
